# ============================================================================
# Nginx Configuration for PropVest Backend API
# ============================================================================
#
# This configuration sets up Nginx as a reverse proxy with:
#   - HTTPS/TLS termination
#   - HTTP to HTTPS redirect
#   - Security headers
#   - Rate limiting
#   - Gzip compression
#   - WebSocket support (for future real-time features)
#
# USAGE:
#   1. Install Nginx: https://nginx.org/en/download.html
#   2. Obtain SSL certificate (Let's Encrypt recommended)
#   3. Update domains and paths in this file
#   4. Copy to: /etc/nginx/sites-available/propvest-api
#   5. Create symlink: ln -s /etc/nginx/sites-available/propvest-api /etc/nginx/sites-enabled/
#   6. Test config: nginx -t
#   7. Reload: systemctl reload nginx
#
# SECURITY CHECKLIST:
#   [x] HTTPS enabled with TLS 1.2+
#   [x] HTTP to HTTPS redirect
#   [x] Security headers configured
#   [x] Rate limiting enabled
#   [x] Large request bodies protected
#   [x] WebSocket support (future-proof)
#
# ============================================================================

# Limit request rate to prevent DDoS
# 10 requests per second per IP, burst up to 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Limit connections per IP
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream backend server
upstream propvest_backend {
    # Your Go API server
    server 127.0.0.1:8081;
    
    # For multiple instances (load balancing):
    # server 127.0.0.1:8081;
    # server 127.0.0.1:8082;
    # server 127.0.0.1:8083;
    
    keepalive 32;
}

# ============================================================================
# HTTP Server - Redirect to HTTPS
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    
    server_name api.propvest.com;
    
    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ============================================================================
# HTTPS Server - Main API
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name api.propvest.com;
    
    # ────────────────────────────────────────────────────────────────────────
    # SSL/TLS Configuration
    # ────────────────────────────────────────────────────────────────────────
    
    # Certificate paths (update with your actual paths)
    ssl_certificate /etc/letsencrypt/live/api.propvest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.propvest.com/privkey.pem;
    
    # Disable SSL (use TLS only)
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Modern cipher suite (prioritize security over compatibility)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # OCSP Stapling (improves SSL handshake performance)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.propvest.com/chain.pem;
    
    # ────────────────────────────────────────────────────────────────────────
    # Security Headers
    # ────────────────────────────────────────────────────────────────────────
    
    # HSTS: Force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    
    # Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Disable unnecessary features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # ────────────────────────────────────────────────────────────────────────
    # Rate Limiting
    # ────────────────────────────────────────────────────────────────────────
    
    # Apply rate limit (10 req/s, burst 20)
    limit_req zone=api_limit burst=20 nodelay;
    
    # Limit concurrent connections per IP
    limit_conn addr 10;
    
    # ────────────────────────────────────────────────────────────────────────
    # General Settings
    # ────────────────────────────────────────────────────────────────────────
    
    # Client request limits
    client_max_body_size 10M;  # Max upload size (adjust for your needs)
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    # Logging
    access_log /var/log/nginx/propvest-api-access.log;
    error_log /var/log/nginx/propvest-api-error.log;
    
    # ────────────────────────────────────────────────────────────────────────
    # Proxy Configuration
    # ────────────────────────────────────────────────────────────────────────
    
    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        proxy_pass http://propvest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # API endpoints
    location /api/ {
        # Enable gzip compression
        gzip on;
        gzip_types application/json;
        gzip_min_length 1000;
        
        # Proxy to backend
        proxy_pass http://propvest_backend;
        proxy_http_version 1.1;
        
        # Preserve original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (for future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Webhook endpoints (higher rate limit)
    location /api/v1/webhooks/ {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://propvest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================================
# Notes for Production Deployment
# ============================================================================
#
# 1. SSL CERTIFICATE SETUP (Let's Encrypt - FREE):
#    
#    # Install certbot
#    sudo apt-get install certbot python3-certbot-nginx
#    
#    # Obtain certificate
#    sudo certbot --nginx -d api.propvest.com
#    
#    # Auto-renewal (runs twice daily)
#    sudo systemctl enable certbot.timer
#
# 2. DNS CONFIGURATION:
#    
#    Create an A record pointing to your server IP:
#      api.propvest.com  →  YOUR_SERVER_IP
#
# 3. FIREWALL RULES:
#    
#    sudo ufw allow 'Nginx Full'
#    sudo ufw allow 22/tcp
#    sudo ufw enable
#
# 4. MONITORING:
#    
#    # Check Nginx status
#    sudo systemctl status nginx
#    
#    # View logs
#    sudo tail -f /var/log/nginx/propvest-api-access.log
#    sudo tail -f /var/log/nginx/propvest-api-error.log
#
# 5. PERFORMANCE TUNING:
#    
#    For high-traffic sites, adjust these in nginx.conf:
#      worker_processes auto;
#      worker_connections 1024;
#      keepalive_timeout 65;
#
# 6. MULTIPLE BACKEND INSTANCES:
#    
#    If running multiple Go API instances, update upstream:
#      upstream propvest_backend {
#          server 127.0.0.1:8081;
#          server 127.0.0.1:8082;
#          server 127.0.0.1:8083;
#      }
#
# 7. SECURITY TESTING:
#    
#    Test your SSL configuration:
#      https://www.ssllabs.com/ssltest/
#    
#    Test security headers:
#      https://securityheaders.com/
#
# ============================================================================
