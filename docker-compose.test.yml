services:
  postgres_test:
    image: postgres:16-alpine
    container_name: propvest_postgres_test
    environment:
      POSTGRES_USER: propvest_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: propvest_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propvest_test -d propvest_test"]
      interval: 2s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster test database
    # No restart policy - test container should stop after tests

  redis_test:
    image: redis:7-alpine
    container_name: propvest_redis_test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data

  rabbitmq_test:
    image: rabbitmq:3-alpine  # No management UI for tests
    container_name: propvest_rabbitmq_test
    environment:
      RABBITMQ_DEFAULT_USER: propvest_test
      RABBITMQ_DEFAULT_PASS: test_password
    ports:
      - "5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
