services:

  postgres:
    image: postgres:16-alpine
    pids_limit: -1
    container_name: propvest_postgres
    environment:
      POSTGRES_USER: propvest
      POSTGRES_PASSWORD: password
      POSTGRES_DB: propvest
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propvest -d propvest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: propvest_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: propvest_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: propvest
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: propvest-backend:latest
    container_name: propvest_api
    env_file:
      - .env
    # In-network overrides: .env targets localhost (native dev on the host), but
    # inside a container localhost is the container itself. `environment:` beats
    # env_file, so containers reach the compose services by service name.
    environment:
      DATABASE_URL: postgres://propvest:password@postgres:5432/propvest?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://propvest:password@rabbitmq:5672/
    ports:
      - "8081:8081"
    command: ["./api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Liveness probe (Phase 3.4): /health deliberately checks no dependencies
    # so the container stays "healthy" across transient DB reconnects, while
    # /health/ready (used by the deploy gate, not here) returns 503 when a real
    # dependency is down. Alpine's busybox wget keeps the image unchanged.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: propvest-backend:latest
    container_name: propvest_worker
    env_file:
      - .env
    # Same in-network overrides as the api service (see above).
    environment:
      DATABASE_URL: postgres://propvest:password@postgres:5432/propvest?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://propvest:password@rabbitmq:5672/
    command: ["./worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # The worker has no HTTP port, so the healthcheck watches the heartbeat
    # file cmd/worker refreshes every 30s. If the file goes stale the container
    # is reported unhealthy (restart: unless-stopped then recycles it).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /tmp/propvest-worker-heartbeat -mmin -2 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data: