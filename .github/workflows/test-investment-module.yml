name: Investment Module Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'internal/models/investment.go'
      - 'internal/repositories/investment_repository.go'
      - 'internal/services/investment_service.go'
      - 'internal/handlers/investment.go'
      - 'internal/dto/investment_dto.go'
      - '**/*investment*test.go'
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Investment Module Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: propvest
          POSTGRES_PASSWORD: password
          POSTGRES_DB: propvest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run repository tests
        run: go test -v -race -coverprofile=coverage_repo.out ./internal/repositories -run TestInvestmentRepository
        env:
          CGO_ENABLED: 1

      - name: Run service tests (when created)
        run: go test -v -race -coverprofile=coverage_service.out ./internal/services -run TestInvestmentService
        continue-on-error: true
        env:
          CGO_ENABLED: 1

      - name: Run handler tests (when created)
        run: go test -v -race -coverprofile=coverage_handler.out ./internal/handlers -run TestInvestmentHandler
        continue-on-error: true

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage_repo.out -o coverage_repo.html
          go tool cover -func=coverage_repo.out

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: |
            coverage_*.out
            coverage_*.html

      - name: Test summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Repository tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage_repo.out >> $GITHUB_STEP_SUMMARY

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: propvest
          POSTGRES_PASSWORD: password
          POSTGRES_DB: propvest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path internal/database/migrations -database "postgres://propvest:password@localhost:5432/propvest_test?sslmode=disable" up

      - name: Build application
        run: go build -v ./cmd/api

      - name: Run integration tests (when created)
        run: go test -v ./tests/integration/...
        continue-on-error: true
        env:
          DATABASE_URL: postgres://propvest:password@localhost:5432/propvest_test?sslmode=disable
          JWT_SECRET: test-secret-key-for-testing
          APP_ENV: test
